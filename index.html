<body>
  <a class="skip-link" href="#view">본문으로 바로 가기</a>
  <aside class="sidebar" aria-label="주 메뉴">
    <a class="brand" href="#dashboard" aria-label="큐리 심사 체크 홈">
      <span class="brand-mark" aria-hidden="true">Q<span>✓</span></span>
      <span><strong>큐리 심사 체크</strong><small>QURI · EXAMINER'S NOTE</small></span>
    </a>
    <div class="workspace-label">나의 업무 공간</div>
    <nav id="main-nav">
      <a href="#dashboard" data-nav="dashboard"><span class="nav-symbol" aria-hidden="true">▦</span> 내 심사건 <span class="nav-count" id="nav-count">0</span></a>
      <a href="#rules" data-nav="rules"><span class="nav-symbol" aria-hidden="true">▤</span> 기준·규칙 사전</a>
      <a href="#backup" data-nav="backup"><span class="nav-symbol" aria-hidden="true">↥</span> 백업·설정</a>
      <a href="#help" data-nav="help"><span class="nav-symbol" aria-hidden="true">?</span> 사용 안내</a>

    <div class="sidebar-bottom">
      <div class="offline-note"><span class="status-dot"></span><strong>오프라인 업무 공간</strong><p>점검 내용은 이 브라우저에 저장됩니다.<br>백업 파일도 꼭 보관해 주세요.</p></div>

    </header>
    <div id="storage-banner" class="storage-banner" hidden></div>

  <dialog id="app-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="print-area" aria-hidden="true"></div>
  <noscript><div class="noscript">이 앱을 사용하려면 브라우저에서 JavaScript를 허용해 주세요. 인터넷 연결은 필요하지 않습니다.</div></noscript>
